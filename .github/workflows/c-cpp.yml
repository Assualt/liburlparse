name: C/C++ CI
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: 更新 Git 子模块
      run: git submodule update --init --recursive
    - name: configure
      run: rm -rf build && mkdir -p build && cd build && cmake ..
    - name: compile
      run: make -j4
    
